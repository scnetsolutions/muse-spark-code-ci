name: macOS session broker cases (diagnostic, mirror only)

on:
  push:
    branches: [ci/diag-mac]

permissions:
  contents: read

jobs:
  facts:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: bash native/darwin/build.sh
      - name: the broker session suite with a long case clock and the clients' output shown
        run: |
          echo "TMPDIR=$TMPDIR XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-unset}"
          sysctl -n hw.ncpu
          DIAG_BROKER=1 npx vitest run test/unit/vault/brokerSession.test.ts --reporter=verbose --testTimeout=120000 || true
